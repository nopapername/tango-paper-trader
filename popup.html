<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tango Paper Trader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><div><h1>Tango Paper Trader</h1><p>纯本地虚拟账户</p></div><span>SIM</span></header>
    <section class="balances">
      <div><small>SOL 余额</small><b id="solBalance">--</b></div>
      <div><small>BNB 余额</small><b id="bnbBalance">--</b></div>
    </section>
    <nav><button class="active" data-tab="portfolio">持仓</button><button data-tab="history">历史</button><button data-tab="settings">设置</button></nav>
    <section id="portfolio" class="tab active"><div id="positions" class="list"></div></section>
    <section id="history" class="tab"><div id="trades" class="list"></div></section>
    <section id="settings" class="tab">
      <label>初始 SOL<input id="startSol" type="number" min="0" step="any"></label>
      <label>初始 BNB<input id="startBnb" type="number" min="0" step="any"></label>
      <label>模拟手续费 %<input id="feePct" type="number" min="0" max="100" step="0.01"></label>
      <label>模拟滑点 %<input id="slippagePct" type="number" min="0" max="100" step="0.01"></label>
      <button id="save" class="primary">保存设置</button>
      <div class="actions"><button id="export">导出 JSON</button><button id="reset" class="danger">重置账户</button></div>
      <p class="notice">修改初始余额不会改变当前账户；“重置账户”才会使用新的初始余额。</p>
    </section>
    <footer id="status">不连接钱包，不发送真实交易</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
