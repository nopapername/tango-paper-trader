<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tango Panel Preview</title>
<style>body{background:#080a08;color:#ddd;font:13px system-ui;margin:0;min-height:100vh}.chart{background:repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.035) 40px),repeating-linear-gradient(90deg,transparent 0 59px,rgba(255,255,255,.035) 60px);inset:0;position:fixed}.candle{background:#33c98b;bottom:18%;height:42%;left:42%;position:absolute;width:8px}.candle:before{background:#33c98b;content:"";height:90px;left:3px;position:absolute;top:-24px;width:2px}.label{left:24px;position:absolute;top:22px;color:#70756f}</style></head>
<body><div class="chart"><div class="label">GMGN chart preview · no real trading</div><div class="candle"></div></div>
<script>globalThis.chrome={runtime:{getURL:(path)=>`/${path}`,sendMessage:async()=>({ok:true,price:160}),openOptionsPage:()=>{}},storage:null};</script>
<script src="/src/shared/constants.js"></script><script src="/src/shared/i18n.js"></script><script src="/src/shared/format.js"></script><script src="/src/core/engine.js"></script><script src="/src/core/storage.js"></script><script src="/src/adapters/gmgn.js"></script>
<script>
  const settings={...Tango.DEFAULT_SETTINGS,language:'zh-CN'};
  const state=Tango.createInitialState(100);state.initialized=true;
  const token={chain:'sol',address:'gaMmLAroWX68NpQ5yDwvoiCyi1C35REJsx6HWyMpump',symbol:'Thuggies',name:'Thuggies',logoUrl:''};
  const quote={priceUsd:0.000016,marketCapUsd:16020,liquidityUsd:9330,solPriceUsd:160,observedAt:Date.now()};
  const bought=Tango.Engine.executeBuy(state,{token,quote,amountSol:1,sourceUrl:location.href},settings).state;
  localStorage.setItem(Tango.STORAGE_KEY,JSON.stringify(bought));localStorage.setItem(Tango.SETTINGS_KEY,JSON.stringify(settings));
  Tango.GMGN.readCurrentToken=async()=>({token,quote:{...quote,observedAt:Date.now()}});Tango.GMGN.discoverTokenCards=()=>0;
</script>
<script src="/src/content/content.js"></script>
<script>if(location.search.includes('edit=1'))setTimeout(()=>document.querySelector('#tango-paper-trader-host')?.shadowRoot?.querySelector('[data-action="edit-presets"]')?.click(),700);</script>
</body></html>
